<body>

<div id="player-container"></div>

<button class="ba-button ba-button--linkedin" id="btn-about" aria-label="About me">
</button>
<a href="https://github.com/ajarean" class="ba-button ba-button--github" aria-label="GitHub projects">
    <img src="assets/projects_folder.svg" width="300">
</a>


<div class="ba-modal-overlay" id="modal-student">
    <div class="ba-modal">
        <div class="ba-modal__header">
            <img src="assets/cafe.png" class="ba-modal__icon" alt="">
            <h2 class="ba-modal__title">About Me</h2>
            <button class="ba-modal__close" id="modal-close" aria-label="Close">X</button>
        </div>
        <div class="ba-modal__body">
            <p>Hi, I'm Andy, a software developer.</p>
            <p>I just graduated with an MS in Computer Science, and I'm currently job hunting.</p>
            <p>This site is a personal playground, since I wanted to experiment with Spine animations.</p>
            <p>&nbsp;</p>
            <p>Current interests: Computer Graphics</p>
        </div>
    </div>
</div>

<script>


// Playerbar config 
const PLAYER = {
    name:       'Andy J.',
    level:      22,
    xpCurrent:  0,
    xpMax:      100,
};

async function initPlayerbar() {
    const res = await fetch('assets/playerbar.svg');
    const svgText = await res.text();
    const doc = new DOMParser().parseFromString(svgText, 'image/svg+xml');

    doc.getElementById('playername').querySelector('tspan').textContent = PLAYER.name;
    doc.getElementById('lv-number').querySelector('tspan').textContent  = PLAYER.level;
    doc.getElementById('xp-fraction').querySelector('tspan').textContent =
        `${PLAYER.xpCurrent}/${PLAYER.xpMax}`;

    const svg = doc.documentElement;
    svg.setAttribute('width', '400');
    svg.removeAttribute('height');

    document.querySelector('.ba-button--linkedin').appendChild(
        document.importNode(svg, true)
    );
}
initPlayerbar();

let spinePlayer = null;
let eyeBone = null;
let currentX = 0, currentY = 0;
let targetX = 0, targetY = 0;
const SMOOTH_FACTOR = 0.1;

new spine.SpinePlayer("player-container", {
	skeleton: "assets/CH0284_home.skel", // you might need to get these files yourself
	atlas: "assets/CH0284_home.atlas",
    scale: 1,
    premultipliedAlpha: false,
    alpha: true,
    backgroundColor: "#00000000",
    showControls: false,
    interactive: false,

    viewport: {
        x: -1200,
        y: 0,
        width: 2560,
        height: 1661,
        clip: true
    },

    success: function(player) {
        // On startup, it should play Start_Idle_01, but this would be really weird to get working on a website since it moves the camera around (I think)
        // Default state is Idle_01, but we want eye tracking 
        // Eye movements DO work on Idle_01, but I think the Look animations have more head movement?
        
        // player.animationState.setAnimation(0, "Look_01_A", true)

        // When the character looks, they play Look_01_A (Look_01_M) and end with LookEnd_01_A (LookEnd_01_M)
        // No idea what the difference between A and M is (for now)


        player.animationState.setAnimation(0, "Idle_01", true) 

        eyeBone = player.skeleton.findBone("Touch_Eye");
        requestAnimationFrame(tickEyes);
    }
});

document.addEventListener('mousemove', (e) => {
    // yuuka eye center (forehead?): 0.50, 0.40 
    const centerX = window.innerWidth * 0.50;
    const centerY = window.innerHeight * 0.40;
    const sensitivity = 2.0; 
    targetX = (e.clientX - centerX) / sensitivity;
    targetY = (centerY - e.clientY) / sensitivity;
});

const modalOverlay = document.getElementById('modal-student');
document.getElementById('btn-about').addEventListener('click', () => modalOverlay.classList.add('open'));
document.getElementById('modal-close').addEventListener('click', () => modalOverlay.classList.remove('open'));
modalOverlay.addEventListener('click', (e) => { if (e.target === modalOverlay) modalOverlay.classList.remove('open'); });

function tickEyes() {
    requestAnimationFrame(tickEyes);
    if (!eyeBone) return;
    currentX += (targetX - currentX) * SMOOTH_FACTOR;
    currentY += (targetY - currentY) * SMOOTH_FACTOR;
    eyeBone.x = currentY;
    eyeBone.y = -1 * currentX;
}

</script>
</body>
</html>
